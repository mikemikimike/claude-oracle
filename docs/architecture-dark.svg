<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="804" viewBox="0 0 1120 804" role="img" aria-labelledby="title desc">
  <title id="title">Claude Oracle: from one question to independent chain briefings</title>
  <desc id="desc">Your session supplies prompts, or the direct CLI uses a Sonnet Architect. Each of one to eight chains has ten parallel Haiku scouts. Each Sonnet organizer receives only its own chain's full scout reports and returns a separate briefing. The caller receives every briefing and performs final synthesis; Oracle does not launch a cross-chain merger or Opus. GitHub and scout local tools are optional.</desc>
  <!-- Editable vector artwork. The light and dark variants share the same layout. -->
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L6 4 L1 7" fill="none" stroke="#739b7e" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>
      text { font-family: 'Segoe UI', Arial, sans-serif; fill: #edf4ec; }
      .eyebrow { font-size: 13px; font-weight: 600; letter-spacing: 1.6px; fill: #b2c4b6; }
      .title { font-size: 30px; font-weight: 600; letter-spacing: -.6px; }
      .heading { font-size: 21px; font-weight: 600; }
      .body { font-size: 16px; fill: #b2c4b6; }
      .small { font-size: 14px; fill: #b2c4b6; }
      .accent { fill: #96dfad; }
      .number { font-size: 14px; font-weight: 600; fill: #96dfad; }
      .flow { fill: none; stroke: #739b7e; stroke-width: 1.6; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect x=".5" y=".5" width="1119" height="803" rx="20" fill="#101b17" stroke="#32483b"/>

  <text x="40" y="40" class="eyebrow">CLAUDE ORACLE / RESEARCH FLOW</text>
  <text x="40" y="82" class="title">One question. Independent lines of research.</text>
  <rect x="938" y="24" width="142" height="30" rx="15" fill="#223e2e"/>
  <text x="1009" y="44" class="eyebrow accent" text-anchor="middle">1–8 CHAINS</text>
  <rect x="40" y="110" width="1040" height="104" rx="12" fill="#18281f" stroke="#32483b"/>
  <text x="64" y="138" class="eyebrow">01 / PLAN</text>
  <text x="64" y="168" class="heading">Your session → focused prompts</text>
  <text x="64" y="193" class="body">Uses the context already in your conversation</text>
  <line x1="560" y1="132" x2="560" y2="190" stroke="#32483b"/>
  <text x="590" y="138" class="eyebrow">DIRECT CLI ALTERNATIVE</text>
  <text x="590" y="168" class="heading">Your question → Sonnet Architect</text>
  <text x="590" y="193" class="body">Plans the research when prompts are not supplied</text>
  <path d="M560 214 V229 M292 229 H828" fill="none" stroke="#739b7e" stroke-width="1.6"/>
  <path class="flow" d="M292 229 V266"/>
  <path class="flow" d="M828 229 V266"/>
  <text x="40" y="256" class="eyebrow">02 / RESEARCH</text>
  <text x="560" y="256" class="small" text-anchor="middle">10 focused tasks per chain</text>
  <rect x="40" y="272" width="504" height="350" rx="16" fill="#18281f" stroke="#32483b"/>
  <text x="64" y="302" class="eyebrow accent">CHAIN A</text>
  <text x="520" y="302" class="small" text-anchor="end">first research area</text>
  <text x="64" y="338" class="heading">10 Haiku scouts</text>
  <text x="520" y="338" class="small" text-anchor="end">Smiths · in parallel</text>
  <rect x="64" y="355" width="40" height="32" rx="7" fill="#243d2c"/>
  <text x="84" y="376" class="number" text-anchor="middle">1</text>
  <rect x="110" y="355" width="40" height="32" rx="7" fill="#243d2c"/>
  <text x="130" y="376" class="number" text-anchor="middle">2</text>
  <rect x="156" y="355" width="40" height="32" rx="7" fill="#243d2c"/>
  <text x="176" y="376" class="number" text-anchor="middle">3</text>
  <rect x="202" y="355" width="40" height="32" rx="7" fill="#243d2c"/>
  <text x="222" y="376" class="number" text-anchor="middle">4</text>
  <rect x="248" y="355" width="40" height="32" rx="7" fill="#243d2c"/>
  <text x="268" y="376" class="number" text-anchor="middle">5</text>
  <rect x="294" y="355" width="40" height="32" rx="7" fill="#243d2c"/>
  <text x="314" y="376" class="number" text-anchor="middle">6</text>
  <rect x="340" y="355" width="40" height="32" rx="7" fill="#243d2c"/>
  <text x="360" y="376" class="number" text-anchor="middle">7</text>
  <rect x="386" y="355" width="40" height="32" rx="7" fill="#243d2c"/>
  <text x="406" y="376" class="number" text-anchor="middle">8</text>
  <rect x="432" y="355" width="40" height="32" rx="7" fill="#243d2c"/>
  <text x="452" y="376" class="number" text-anchor="middle">9</text>
  <rect x="478" y="355" width="40" height="32" rx="7" fill="#243d2c"/>
  <text x="498" y="376" class="number" text-anchor="middle">10</text>
  <text x="292" y="413" class="body" text-anchor="middle">Web research · GitHub / local tools optional</text>
  <path class="flow" d="M292 427 V451"/>
  <rect x="64" y="458" width="456" height="78" rx="10" fill="#1d3024" stroke="#32483b"/>
  <text x="84" y="484" class="eyebrow">SONNET / ANDERSON</text>
  <text x="84" y="514" class="heading">Organizes only this chain’s reports</text>
  <path class="flow" d="M292 536 V558"/>
  <rect x="64" y="566" width="456" height="36" rx="8" fill="#223e2e"/>
  <text x="84" y="590" class="body accent">Chain briefing</text>
  <text x="500" y="590" class="small" text-anchor="end">findings · disputes · gaps</text>
  <path class="flow" d="M292 622 V669"/>
  <rect x="576" y="272" width="504" height="350" rx="16" fill="#18281f" stroke="#32483b"/>
  <text x="600" y="302" class="eyebrow accent">CHAIN B … H</text>
  <text x="1056" y="302" class="small" text-anchor="end">additional research areas</text>
  <text x="600" y="338" class="heading">10 Haiku scouts</text>
  <text x="1056" y="338" class="small" text-anchor="end">Smiths · in parallel</text>
  <rect x="600" y="355" width="40" height="32" rx="7" fill="#243d2c"/>
  <text x="620" y="376" class="number" text-anchor="middle">1</text>
  <rect x="646" y="355" width="40" height="32" rx="7" fill="#243d2c"/>
  <text x="666" y="376" class="number" text-anchor="middle">2</text>
  <rect x="692" y="355" width="40" height="32" rx="7" fill="#243d2c"/>
  <text x="712" y="376" class="number" text-anchor="middle">3</text>
  <rect x="738" y="355" width="40" height="32" rx="7" fill="#243d2c"/>
  <text x="758" y="376" class="number" text-anchor="middle">4</text>
  <rect x="784" y="355" width="40" height="32" rx="7" fill="#243d2c"/>
  <text x="804" y="376" class="number" text-anchor="middle">5</text>
  <rect x="830" y="355" width="40" height="32" rx="7" fill="#243d2c"/>
  <text x="850" y="376" class="number" text-anchor="middle">6</text>
  <rect x="876" y="355" width="40" height="32" rx="7" fill="#243d2c"/>
  <text x="896" y="376" class="number" text-anchor="middle">7</text>
  <rect x="922" y="355" width="40" height="32" rx="7" fill="#243d2c"/>
  <text x="942" y="376" class="number" text-anchor="middle">8</text>
  <rect x="968" y="355" width="40" height="32" rx="7" fill="#243d2c"/>
  <text x="988" y="376" class="number" text-anchor="middle">9</text>
  <rect x="1014" y="355" width="40" height="32" rx="7" fill="#243d2c"/>
  <text x="1034" y="376" class="number" text-anchor="middle">10</text>
  <text x="828" y="413" class="body" text-anchor="middle">Web research · GitHub / local tools optional</text>
  <path class="flow" d="M828 427 V451"/>
  <rect x="600" y="458" width="456" height="78" rx="10" fill="#1d3024" stroke="#32483b"/>
  <text x="620" y="484" class="eyebrow">SONNET / ANDERSON</text>
  <text x="620" y="514" class="heading">Organizes only this chain’s reports</text>
  <path class="flow" d="M828 536 V558"/>
  <rect x="600" y="566" width="456" height="36" rx="8" fill="#223e2e"/>
  <text x="620" y="590" class="body accent">Chain briefing</text>
  <text x="1036" y="590" class="small" text-anchor="end">findings · disputes · gaps</text>
  <path class="flow" d="M828 622 V669"/>
  <text x="560" y="651" class="small" text-anchor="middle">Separate briefings · full scout reports per organizer</text>
  <rect x="40" y="676" width="1040" height="88" rx="12" fill="#24372a" stroke="#32483b"/>
  <text x="64" y="704" class="eyebrow accent">03 / RETURN TO CALLER</text>
  <text x="64" y="738" class="heading">Your session compares the evidence and writes the final answer.</text>
  <text x="40" y="789" class="eyebrow">HAIKU SCOUTS · SONNET ORGANIZERS</text>
  <text x="1080" y="789" class="small" text-anchor="end">CLI returns the report on stdout · no extra Opus call</text>
</svg>
